<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Productos</title>

  <!-- Puedes usar el mismo CSS o crear uno nuevo -->
  <link rel="stylesheet" href="/diseno-grafico.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Navbar -->
  <div th:replace="fragments/navbar :: navbar"></div>

  <div class="subnav">
    <h1>Todos los Productos</h1>
    <p>Explora todos los productos disponibles sin importar la categoría.</p>
  </div>

  <section class="card-container">
    <div class="card" th:each="trabajo : ${trabajos}">
      <div class="card-img-container">
        <a th:href="@{/trabajo/{id}(id=${trabajo.id})}" style="text-decoration: none; color: inherit;">
          <img th:src="${trabajo.imagenUrl}" th:alt="${trabajo.titulo}" />
          <div class="img-hover-overlay">
            <p class="descripcion-hover" th:text="${trabajo.descripcion}">Descripción</p>
          </div>
        </a>
      </div>
      <div class="card-content">
        <a th:href="@{/trabajo/{id}(id=${trabajo.id})}" style="text-decoration: none; color: inherit;">
          <h2 th:text="${trabajo.titulo}">Título</h2>
          <p><strong>Precio: </strong>S/ <span th:text="${trabajo.precio}">0.00</span></p>
        </a>
      </div>
    </div>
  </section>

  <div th:replace="fragments/footer :: footer"></div>

  <script src="/JS/Diseñografico.js"></script>
</body>
</html>
