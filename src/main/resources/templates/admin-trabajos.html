<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" href="/css/admin-trabajos.css" />

<head>
    <title>Administrar Trabajos</title>
</head>
<body>
    <h1>Lista de Trabajos</h1>
    <table border="1" cellpadding="5" cellspacing="0">
        <form th:action="@{/admin/trabajos}" method="get">
    <label>Filtrar por estado:</label>
    <select name="estado">
        <option value="">Todos</option>
        <option value="aprobados">Aprobados</option>
        <option value="pendientes">No aprobados</option>
    </select>
    <button type="submit">Filtrar</button>
</form>

        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Descripción</th>
                <th>Categoría</th> <!-- Nueva columna para categoría -->
                <th>Imagen</th>
                <th>Precio</th>
                <th>Contacto</th>
                <th>Aprobado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="trabajo : ${trabajos}">
                <td th:text="${trabajo.id}"></td>
                <td th:text="${trabajo.titulo}"></td>
                <td th:text="${trabajo.descripcion}"></td>
                <td th:text="${trabajo.categoria}"></td> <!-- Aquí mostramos la categoría -->
                <td><img th:src="${trabajo.imagenUrl}" alt="Imagen" width="100" /></td>
                <td th:text="${trabajo.precio}"></td>
                <td th:text="${trabajo.numeroContacto}"></td>
                <td>
                    <span th:text="${trabajo.aprobado} ? 'Sí' : 'No'"></span>
                </td>
                <td>
                    <a th:href="@{/admin/trabajos/editar/{id}(id=${trabajo.id})}">Editar</a> |
                    <a th:href="@{/admin/trabajos/eliminar/{id}(id=${trabajo.id})}" 
                       onclick="return confirm('¿Seguro quieres eliminar?');">Eliminar</a> |
                    <form th:action="@{/admin/trabajos/cambiarEstado/{id}(id=${trabajo.id})}" method="post" style="display:inline;">
                        <button type="submit" th:text="${trabajo.aprobado} ? 'Desaprobar' : 'Aprobar'"></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
